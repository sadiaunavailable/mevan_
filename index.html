<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mevan — Elegance in Every Thread</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-top:#f3eefa;
    --bg-bottom:#e7dcf4;
    --lavender:#b6a0d9;
    --plum:#4d3768;
    --ink:#2c2138;
    --gold:#c7a876;
    --card:#fffdfb;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    min-height:100vh;
    background: linear-gradient(160deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
    font-family:'Jost', sans-serif;
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 20px;
  }

  .page{
    width:100%;
    max-width:400px;
    text-align:center;
  }

  .emblem{
    width:132px;
    height:132px;
    margin:0 auto 18px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    background:var(--card);
    box-shadow:0 8px 24px rgba(77,55,104,0.15);
    overflow:hidden;
  }
  .emblem img{
    width:100%;
    height:100%;
    object-fit:contain;
    padding:6px;
  }

  h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:36px;
    letter-spacing:3px;
    color:var(--ink);
  }

  .tagline{
    margin-top:6px;
    font-size:12px;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--plum);
    opacity:0.75;
  }

  .stitch{
    width:56px;
    height:1px;
    margin:22px auto;
    background:repeating-linear-gradient(90deg, var(--gold) 0 6px, transparent 6px 11px);
  }

  .links{
    display:flex;
    flex-direction:column;
    gap:14px;
    margin-top:6px;
  }

  .link-card{
    display:flex;
    align-items:center;
    gap:16px;
    background:var(--card);
    border:1px solid rgba(182,160,217,0.5);
    border-radius:14px;
    padding:16px 20px;
    text-decoration:none;
    color:var(--ink);
    text-align:left;
    transition:transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
  }
  .link-card:hover, .link-card:focus-visible{
    transform:translateY(-2px);
    box-shadow:0 10px 22px rgba(77,55,104,0.16);
    border-color:var(--gold);
    outline:none;
  }

  .icon{
    width:42px;
    height:42px;
    flex:none;
    border-radius:50%;
    background:linear-gradient(145deg, var(--lavender), var(--plum));
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
  }
  .icon svg{ width:20px; height:20px; }

  .link-text .label{
    font-size:15px;
    font-weight:500;
    letter-spacing:0.4px;
  }
  .link-text .sub{
    font-size:11px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--plum);
    opacity:0.6;
    margin-top:2px;
  }

  footer{
    margin-top:34px;
    font-size:10px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--plum);
    opacity:0.45;
  }

  @media (prefers-reduced-motion: reduce){
    .link-card{ transition:none; }
  }
</style>
</head>
