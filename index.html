<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mevan — Elegance in Every Thread</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-top:#f3eefa;
    --bg-bottom:#e7dcf4;
    --lavender:#b6a0d9;
    --plum:#4d3768;
    --ink:#2c2138;
    --gold:#c7a876;
    --card:#fffdfb;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    min-height:100vh;
    background: linear-gradient(160deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
    font-family:'Jost', sans-serif;
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 20px;
  }

  .page{
    width:100%;
    max-width:400px;
    text-align:center;
  }

  .emblem{
    width:92px;
    height:92px;
    margin:0 auto 22px;
    border-radius:50%;
    border:1px solid var(--gold);
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    background:var(--card);
    box-shadow:0 8px 24px rgba(77,55,104,0.15);
  }
  .emblem::before{
    content:"";
    position:absolute;
    inset:6px;
    border-radius:50%;
    border:1px solid rgba(199,168,118,0.45);
  }
  .emblem span{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:40px;
    color:var(--plum);
    letter-spacing:1px;
  }

  h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:36px;
    letter-spacing:3px;
    color:var(--ink);
  }

  .tagline{
    margin-top:6px;
    font-size:12px;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--plum);
    opacity:0.75;
  }

  .stitch{
    width:56px;
    height:1px;
    margin:22px auto;
    background:repeating-linear-gradient(90deg, var(--gold) 0 6px, transparent 6px 11px);
  }

  .links{
    display:flex;
    flex-direction:column;
    gap:14px;
    margin-top:6px;
  }

  .link-card{
    display:flex;
    align-items:center;
    gap:16px;
    background:var(--card);
    border:1px solid rgba(182,160,217,0.5);
    border-radius:14px;
    padding:16px 20px;
    text-decoration:none;
    color:var(--ink);
    text-align:left;
    transition:transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
  }
  .link-card:hover, .link-card:focus-visible{
    transform:translateY(-2px);
    box-shadow:0 10px 22px rgba(77,55,104,0.16);
    border-color:var(--gold);
    outline:none;
  }

  .icon{
    width:42px;
    height:42px;
    flex:none;
    border-radius:50%;
    background:linear-gradient(145deg, var(--lavender), var(--plum));
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
  }
  .icon svg{ width:20px; height:20px; }

  .link-text .label{
    font-size:15px;
    font-weight:500;
    letter-spacing:0.4px;
  }
  .link-text .sub{
    font-size:11px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--plum);
    opacity:0.6;
    margin-top:2px;
  }

  footer{
    margin-top:34px;
    font-size:10px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--plum);
    opacity:0.45;
  }

  @media (prefers-reduced-motion: reduce){
    .link-card{ transition:none; }
  }
</style>
</head>
<body>
  <div class="page">
    <div class="emblem"><span>M</span></div>
    <h1>MEVAN</h1>
    <div class="tagline">Elegance in Every Thread</div>
    <div class="stitch"></div>

    <div class="links">
      <a class="link-card" href="https://mevan.store/" target="_blank" rel="noopener">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/>
            <path d="M3 12h18M12 3c2.6 2.6 4 5.8 4 9s-1.4 6.4-4 9c-2.6-2.6-4-5.8-4-9s1.4-6.4 4-9z"/>
          </svg>
        </span>
        <span class="link-text">
          <div class="label">Shop the Collection</div>
          <div class="sub">Website</div>
        </span>
      </a>

      <a class="link-card" href="https://www.facebook.com/mevanpakistanidress" target="_blank" rel="noopener">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M13.5 21v-7.6h2.6l.4-3H13.5V8.4c0-.87.24-1.46 1.5-1.46H16.6V4.35C16.3 4.31 15.3 4.22 14.13 4.22c-2.4 0-4.05 1.47-4.05 4.16v2.02H7.5v3h2.58V21h3.42z"/>
          </svg>
        </span>
        <span class="link-text">
          <div class="label">Follow us on Facebook</div>
          <div class="sub">@mevanpakistanidress</div>
        </span>
      </a>

      <a class="link-card" href="https://www.instagram.com/shopmevan/" target="_blank" rel="noopener">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="3.5" y="3.5" width="17" height="17" rx="5"/>
            <circle cx="12" cy="12" r="4"/>
            <circle cx="17.2" cy="6.8" r="1" fill="currentColor" stroke="none"/>
          </svg>
        </span>
        <span class="link-text">
          <div class="label">Follow us on Instagram</div>
          <div class="sub">@shopmevan</div>
        </span>
      </a>
    </div>

    <footer>Mevan — Designer Wear</footer>
  </div>
</body>
</html>
